{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Cadastro de Item</h1>
<form method="post" class="row g-3">
  <div class="col-md-6">
    <label class="form-label" for="name">Nome</label>
    <input class="form-control" id="name" name="name" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="category_id">Categoria</label>
    <select class="form-select" id="category_id" name="category_id" required>
      <option value="" selected disabled>Selecione...</option>
      {% for category in categories %}
      <option value="{{ category.id }}">{{ category.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12">
    <label class="form-label" for="description">Descrição</label>
    <textarea class="form-control" id="description" name="description" rows="2" required></textarea>
  </div>
  <div class="col-md-4">
    <label class="form-label" for="quantity">Quantidade</label>
    <input class="form-control" id="quantity" name="quantity" type="number" min="0" value="0" required>
  </div>
  <div class="col-md-4">
    <label class="form-label" for="minimum_quantity">Quantidade mínima</label>
    <input class="form-control" id="minimum_quantity" name="minimum_quantity" type="number" min="0" value="0" required>
  </div>
  <div class="col-md-4">
    <label class="form-label" for="serial_number">Número de série</label>
    <input class="form-control" id="serial_number" name="serial_number">
  </div>
  <div class="col-md-6">
    <label class="form-label" for="location">Localização</label>
    <input class="form-control" id="location" name="location" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="supplier">Fornecedor</label>
    <input class="form-control" id="supplier" name="supplier">
  </div>
  <div class="col-md-6">
    <label class="form-label" for="acquisition_value">Valor de aquisição</label>
    <input class="form-control" id="acquisition_value" name="acquisition_value" type="number" min="0" step="0.01" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="purchase_date">Data de compra</label>
    <input class="form-control" id="purchase_date" name="purchase_date" type="date">
  </div>
  <div class="col-md-6">
    <label class="form-label" for="tags">Tags (separadas por vírgula)</label>
    <input class="form-control" id="tags" name="tags" placeholder="ex: urgente, manutenção">
  </div>
  <div class="col-md-6">
    <label class="form-label" for="attachments">Anexos (um por linha)</label>
    <textarea class="form-control" id="attachments" name="attachments" rows="2" placeholder="URL ou referência"></textarea>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('items') }}">Cancelar</a>
  </div>
</form>
{% endblock %}

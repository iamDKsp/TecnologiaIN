{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-4 col-lg-5 col-md-6">
    <div class="auth-hero text-center mb-5">
      <h1 class="display-5 fw-bold text-gradient">Inventory Tecfag</h1>
      <p class="text-muted mb-0">Sistema inteligente para controle de inventário de T.I.</p>
    </div>
    <div class="card glass-card shadow-lg border-0">
      <div class="card-body p-4 p-lg-5">
        <h2 class="h4 fw-semibold mb-4">Escolha seu usuário</h2>
        <form method="post" class="vstack gap-3">
          <div>
            <label class="form-label" for="user_id">Usuário</label>
            <select class="form-select form-select-lg" id="user_id" name="user_id" required>
              <option value="" selected disabled>Selecione...</option>
              {% for user in users %}
              <option value="{{ user.id }}">{{ user.name }} ({{ user.role.value|capitalize }})</option>
              {% endfor %}
            </select>
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
